name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the site builder
        run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the Node-side ontology check still runs
        working-directory: node
        run: |
          npm ci
          npm run --silent check:ontology || echo "::warning::ontology check reported a non-zero exit; see the step log"
      # The notebooks are the instrument that checks Fieldwork's computations. Until
      # 2026-10-11 nothing executed them, so the site was built from notebooks nobody had
      # run. A broken notebook now blocks publishing rather than being published.
      - name: Install the check environment
        run: pip install -r requirements-checks.txt
      - name: Execute every notebook
        run: python scripts/run_notebooks.py
      - name: Build the JupyterLite site
        run: jupyter lite build --contents content --output-dir _output
      # CPython passing is necessary and not sufficient: the distribution the kernel loads
      # carries different package versions, and on 2026-10-11 two notebooks that pass in
      # CPython in eight seconds failed in the browser. This runs the built site in the
      # kernel a learner actually gets.
      # Reports without blocking, for now. 02-clip does not complete in the browser within
      # twelve minutes and the cause is not established, so making this gate publishing
      # would stop the site updating over one unresolved notebook. It becomes blocking when
      # that is fixed; until then it is a check whose failures are visible in the log.
      - name: Execute every notebook in the browser kernel
        continue-on-error: true
        working-directory: node
        run: |
          npx playwright install --with-deps chromium
          npm run --silent check:notebooks-browser
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
